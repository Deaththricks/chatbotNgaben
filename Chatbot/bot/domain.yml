version: '3.1'

# Questions are split by kind (plan #13, 2026-10-13): each tanya_* intent but tanya_kompleks is a
# simple question its template answers without the LLM (action_jawab_template); tanya_kompleks and
# anything the template cannot take go to the LLM pipeline (action_graph_rag). data/nlu.yml is
# generated by scripts/gen_nlu.py.
intents:
  - sapa
  - pamit
  - bot_challenge
  - digidaw
  - out_of_scope
  - tanya_definisi
  - tanya_makna
  - tanya_fungsi
  - tanya_jenis
  - tanya_tahapan
  - tanya_komponen
  - tanya_sarana
  - tanya_lokasi
  - tanya_waktu
  - tanya_pelaku
  - tanya_sebutan_lain
  - tanya_asal_kata
  - tanya_bagian_dari
  - tanya_kompleks
  - nlu_fallback

slots:
  current_entity:
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  entity_history:
    type: list
    influence_conversation: false
    mappings:
      - type: custom

actions:
  - utter_sapa
  - utter_pamit
  - utter_iamabot
  - utter_digidaw
  - utter_out_of_scope
  - utter_default
  - action_jawab_template
  - action_graph_rag
  - action_llm_fallback
  - action_out_of_scope
  - action_sapa
  - action_pamit

responses:
  utter_sapa:
    - text: "Om Swastiastu, saya asisten AI untuk upacara adat Bali."
  utter_pamit:
    - text: "Om Santih Santih Santih, Semoga bermanfaat."
  utter_iamabot:
    - text: "Saya asisten AI untuk upacara adat Bali."
  utter_digidaw:
    - text: "rawr rawr rawr..."
  utter_out_of_scope:
    - text: "Maaf, saya hanya melayani pertanyaan seputar upacara Ngaben dan terminologinya."
  # config.yml's RulePolicy core_fallback_action_name is action_default_fallback,
  # which utters this response -- without it, that fallback path (distinct from
  # the NLU-level nlu_fallback intent) sent the user nothing at all.
  utter_default:
    - text: "Maaf, saya kurang memahami maksud Anda. Bisa dijelaskan dengan kalimat lain?"

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true