version: '3.1'

intents:
  - sapa
  - pamit
  - bot_challenge
  - out_of_scope
  - ask_ngaben_detail
  - nlu_fallback

slots:
  current_entity:
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  entity_history:
    type: list
    influence_conversation: false
    mappings:
      - type: custom

actions:
  - utter_sapa
  - utter_pamit
  - utter_iamabot
  - utter_out_of_scope
  - utter_default
  - action_graph_rag
  - action_llm_fallback

responses:
  utter_sapa:
    - text: "Om Swastiastu, Saya asisten istilah upacara Ngaben berbasis AI. Silakan tanyakan istilah, tahapan, atau makna yang ingin Anda ketahui."
  utter_pamit:
    - text: "Om Santih Santih Santih, Semoga bermanfaat."
  utter_iamabot:
    - text: "Saya bot glosarium istilah Ngaben. Jawaban saya disintesis langsung dari basis pengetahuan terminologi upacara Ngaben (GraphRAG)."
  utter_out_of_scope:
    - text: "Maaf, saya hanya melayani pertanyaan seputar upacara Ngaben dan terminologinya."
  # config.yml's RulePolicy core_fallback_action_name is action_default_fallback,
  # which utters this response -- without it, that fallback path (distinct from
  # the NLU-level nlu_fallback intent) sent the user nothing at all.
  utter_default:
    - text: "Maaf, saya kurang memahami maksud Anda. Bisa dijelaskan dengan kalimat lain?"

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true