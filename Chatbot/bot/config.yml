recipe: default.v1
assistant_id: ngaben-glossary-bot
language: id

pipeline:
  - name: WhitespaceTokenizer
  - name: RegexFeaturizer
  - name: LexicalSyntacticFeaturizer
  - name: CountVectorsFeaturizer
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4
  # RegexEntityExtractor removed 2026-09-29: with no entity annotated in nlu.yml it had
  # no patterns ("has not been trained properly yet" warning on every run) and never
  # extracted anything -- terms come from the LLM + kb_resolver in actions.py.
  # lookup_istilah.yml still feeds RegexFeaturizer above.
  - name: DIETClassifier
    epochs: 160
    constrain_similarities: true
    batch_size: [32, 64]
  # EntitySynonymMapper and ResponseSelector removed 2026-09-30: no entity is annotated
  # and there is no retrieval intent, so both trained on nothing.
  - name: FallbackClassifier
    threshold: 0.45
    ambiguity_threshold: 0.1

# Every intent is answered by a rule (data/rules.yml), so TEDPolicy and
# UnexpecTEDIntentPolicy were removed 2026-09-30: they only added training time.
policies:
  - name: MemoizationPolicy
  - name: RulePolicy
    core_fallback_threshold: 0.3
    core_fallback_action_name: action_default_fallback
    enable_fallback_prediction: true
