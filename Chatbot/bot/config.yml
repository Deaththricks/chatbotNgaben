recipe: default.v1
assistant_id: ngaben-glossary-bot
language: id

pipeline:
  - name: WhitespaceTokenizer
  - name: RegexFeaturizer
  - name: LexicalSyntacticFeaturizer
  - name: CountVectorsFeaturizer
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4
  # RegexEntityExtractor removed 2026-09-29: with no entity annotated in nlu.yml it had
  # no patterns ("has not been trained properly yet" warning on every run) and never
  # extracted anything -- terms come from the LLM + kb_resolver in actions.py.
  # lookup_istilah.yml still feeds RegexFeaturizer above.
  - name: DIETClassifier
    epochs: 160
    constrain_similarities: true
    batch_size: [32, 64]
  - name: EntitySynonymMapper
  - name: ResponseSelector
    epochs: 100
    constrain_similarities: true
  - name: FallbackClassifier
    threshold: 0.45
    ambiguity_threshold: 0.1

policies:
  - name: MemoizationPolicy
  - name: RulePolicy
    core_fallback_threshold: 0.3
    core_fallback_action_name: action_default_fallback
    enable_fallback_prediction: true
  - name: UnexpecTEDIntentPolicy
    max_history: 5
    epochs: 100
  - name: TEDPolicy
    max_history: 5
    epochs: 100
    constrain_similarities: true
