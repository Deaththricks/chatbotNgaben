version: "3.1"

rules:
  # action_sapa greets, or answers a Ngaben question NLU read as a greeting ("boleh foto saat ngaben?")
  - rule: sapa
    steps:
      - intent: sapa
      - action: action_sapa

  # action_pamit says goodbye, or invites a question NLU read as one ("saya mau nanya")
  - rule: pamit
    steps:
      - intent: pamit
      - action: action_pamit

  - rule: bot challenge
    steps:
      - intent: bot_challenge
      - action: utter_iamabot

  - rule: digidaw
    steps:
      - intent: digidaw
      - action: utter_digidaw

  # action_out_of_scope still answers a message that names a KB term outright
  # (a misfiled Ngaben question), else utters utter_out_of_scope
  - rule: out of scope
    steps:
      - intent: out_of_scope
      - action: action_out_of_scope

  # simple questions: a template answer from the KB, no LLM (a question the template cannot take
  # goes on to action_graph_rag inside the action)
  - rule: tanya definisi
    steps:
      - intent: tanya_definisi
      - action: action_jawab_template

  - rule: tanya makna
    steps:
      - intent: tanya_makna
      - action: action_jawab_template

  - rule: tanya fungsi
    steps:
      - intent: tanya_fungsi
      - action: action_jawab_template

  - rule: tanya jenis
    steps:
      - intent: tanya_jenis
      - action: action_jawab_template

  - rule: tanya tahapan
    steps:
      - intent: tanya_tahapan
      - action: action_jawab_template

  - rule: tanya komponen
    steps:
      - intent: tanya_komponen
      - action: action_jawab_template

  - rule: tanya sarana
    steps:
      - intent: tanya_sarana
      - action: action_jawab_template

  - rule: tanya lokasi
    steps:
      - intent: tanya_lokasi
      - action: action_jawab_template

  - rule: tanya waktu
    steps:
      - intent: tanya_waktu
      - action: action_jawab_template

  - rule: tanya pelaku
    steps:
      - intent: tanya_pelaku
      - action: action_jawab_template

  - rule: tanya sebutan lain
    steps:
      - intent: tanya_sebutan_lain
      - action: action_jawab_template

  - rule: tanya asal kata
    steps:
      - intent: tanya_asal_kata
      - action: action_jawab_template

  - rule: tanya bagian dari
    steps:
      - intent: tanya_bagian_dari
      - action: action_jawab_template

  # everything else: the LLM pipeline (its code answers first, then Qwen on Groq)
  - rule: tanya kompleks
    steps:
      - intent: tanya_kompleks
      - action: action_graph_rag

  - rule: fallback nlu
    steps:
      - intent: nlu_fallback
      - action: action_llm_fallback